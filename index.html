<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>카테고리별 넷플릭스 콘텐츠 찾기</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <h1 class="logo">CATEGORIZE</h1>
      <div class="header-controls">
        <select id="regionSelect" class="region-select" aria-label="국가 선택"></select>
        <select id="languageSelect" class="language-select" aria-label="상세 설명 언어 선택" title="콘텐츠 상세 설명 언어"></select>
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="불러온 목록 내에서 검색..." />
        </div>
        <button class="icon-btn" id="settingsBtn" title="TMDB API 키 설정" aria-label="설정">⚙</button>
      </div>
    </div>
  </header>

  <nav class="category-nav category-nav-major" id="majorNav"></nav>
  <nav class="category-nav category-nav-mid" id="midNav"></nav>
  <nav class="category-nav category-nav-leaf" id="leafNav"></nav>

  <main class="content-area">
    <p class="result-count" id="resultCount"></p>
    <p class="status-msg" id="statusMsg" hidden></p>
    <div class="grid" id="grid"></div>
    <p class="empty-msg" id="emptyMsg" hidden>조건에 맞는 콘텐츠가 없습니다.</p>
    <button class="load-more" id="loadMoreBtn" hidden>더 보기</button>
  </main>

  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal" id="modal"></div>
  </div>

  <div class="modal-overlay" id="apiKeyOverlay" hidden>
    <div class="modal api-key-modal">
      <div class="modal-body">
        <h2 class="api-key-title">TMDB API 키가 필요해요</h2>
        <p class="api-key-desc">
          이 앱은 <strong>TMDB(The Movie Database)</strong>의 실제 영화·시리즈 데이터와
          국가별 넷플릭스 제공 정보를 실시간으로 불러옵니다. 무료 키를 발급받아 아래에
          붙여넣으면 브라우저에만 저장되고 서버로 전송되지 않습니다.
        </p>
        <ol class="api-key-steps">
          <li><a href="https://www.themoviedb.org/signup" target="_blank" rel="noopener">themoviedb.org</a>에서 무료 가입</li>
          <li>설정(Settings) → API 메뉴에서 <strong>API Read Access Token (v3 auth)</strong> 발급</li>
          <li>아래 입력창에 붙여넣기</li>
        </ol>
        <input type="password" id="apiKeyInput" class="api-key-input" placeholder="TMDB API Read Access Token 붙여넣기" />
        <p class="api-key-error" id="apiKeyError" hidden></p>
        <button class="api-key-save" id="apiKeySave">저장하고 시작하기</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
