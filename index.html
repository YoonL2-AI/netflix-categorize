<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>카테고리별 넷플릭스 콘텐츠 찾기</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <h1 class="logo">CATEGORIZE</h1>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="제목 또는 줄거리로 검색..." />
      </div>
    </div>
  </header>

  <nav class="category-nav" id="categoryNav"></nav>

  <main class="content-area">
    <p class="result-count" id="resultCount"></p>
    <div class="grid" id="grid"></div>
    <p class="empty-msg" id="emptyMsg" hidden>조건에 맞는 콘텐츠가 없습니다.</p>
  </main>

  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal" id="modal"></div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
